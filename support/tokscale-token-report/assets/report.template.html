<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Local Usage Audit</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f6f6f7;
      --surface-strong: #efeff0;
      --text: #292a2d;
      --muted: #8a8b90;
      --muted-strong: #686a70;
      --line: #e8e8e9;
      --line-strong: #dedee0;
      --ink: #252629;
      --blue: #369cf2;
      --orange: #ff8738;
      --green: #56bc78;
      --pink: #e96b9f;
      --purple: #8871db;
      --focus: rgba(54, 156, 242, 0.22);
    }
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .page {
      width: 100%;
      max-width: 1680px;
      margin: 0 auto;
      padding: 18px 18px 44px;
    }
    .audit-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    .eyebrow {
      color: #a0a1a5;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .as-of { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 10px 8px;
    }
    .field { display: grid; gap: 5px; }
    .field-label { color: var(--muted); font-size: 11px; }
    input[type="date"] {
      height: 36px;
      min-width: 168px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: #fff;
      padding: 0 10px;
      color: var(--text);
      outline: none;
    }
    input[type="date"]:focus-visible,
    .chip:focus-visible,
    .segment:focus-visible {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--focus);
      outline: none;
    }
    .quick-ranges { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip, .segment {
      height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: #fff;
      padding: 0 13px;
      cursor: pointer;
      transition: background .14s ease, color .14s ease, border-color .14s ease, transform .14s ease;
    }
    .chip:hover, .segment:hover { border-color: #bfc0c4; transform: translateY(-1px); }
    .chip[aria-pressed="true"], .segment[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 8px;
      margin-top: 12px;
    }
    .filter-name { color: var(--muted); font-size: 12px; margin-right: 2px; }
    .segment-group { display: flex; flex-wrap: wrap; gap: 7px; }
    .segment { height: 30px; padding: 0 12px; font-size: 12px; }
    .scope-line {
      margin: 12px 0 16px;
      color: #a0a1a5;
      font-size: 11px;
      min-height: 16px;
    }
    .notice {
      display: none;
      margin: 12px 0;
      padding: 10px 12px;
      border: 1px solid #efc3c3;
      border-radius: 8px;
      background: #fff7f7;
      color: #a83f3f;
      font-size: 12px;
      line-height: 1.5;
    }
    .notice.is-visible { display: block; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .kpi {
      min-height: 92px;
      padding: 15px 16px 13px;
      border-radius: 14px;
      background: var(--surface);
    }
    .kpi-label { color: var(--muted-strong); font-size: 12px; }
    .kpi-value { margin-top: 4px; font-size: 21px; font-weight: 760; letter-spacing: -.025em; }
    .kpi-detail { margin-top: 7px; color: var(--muted); font-size: 11px; }
    .client-summary { margin-bottom: 16px; }
    .client-row {
      display: grid;
      grid-template-columns: 180px minmax(260px, 1fr) 135px 125px 105px;
      gap: 16px;
      align-items: center;
      min-height: 50px;
      border-bottom: 1px solid var(--line);
    }
    .client-name { font-size: 13px; font-weight: 650; }
    .client-track {
      position: relative;
      height: 8px;
      overflow: hidden;
      border-radius: 2px;
      background: #ededee;
    }
    .client-fill { height: 100%; min-width: 2px; border-radius: inherit; }
    .client-tokens { display: flex; align-items: baseline; gap: 5px; color: var(--muted); white-space: nowrap; }
    .client-tokens strong, .client-cost, .client-calls { color: #55575c; font-weight: 650; }
    .client-unit { font-size: 10px; }
    .section { margin-top: 23px; }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
    }
    h2 { margin: 0; font-size: 19px; line-height: 1.25; letter-spacing: -.025em; }
    .section-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 6px 8px;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }
    .chart-shell { position: relative; height: 350px; border-bottom: 1px solid var(--line); }
    .chart-shell.cost-chart { height: 335px; }
    canvas { width: 100% !important; height: 100% !important; }
    .chart-caption { min-height: 26px; padding-top: 8px; color: #9b9ca1; font-size: 11px; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table.sticky-col th:first-child,
    table.sticky-col td:first-child {
      position: sticky;
      left: 0;
      background: var(--bg);
      box-shadow: 1px 0 0 var(--line);
    }
    table.sticky-col thead th:first-child { z-index: 2; }
    table { width: 100%; border-collapse: collapse; min-width: 820px; }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 11px 8px;
      text-align: right;
      vertical-align: middle;
      white-space: nowrap;
    }
    th { color: var(--text); font-size: 12px; font-weight: 650; }
    td { color: #505257; font-size: 12px; font-weight: 560; }
    th:first-child, td:first-child { padding-left: 0; text-align: left; }
    th:last-child, td:last-child { padding-right: 0; }
    .cell-primary { color: #47494e; font-weight: 670; }
    .cell-prefix { margin-right: 7px; color: #a3a4a8; font-size: 10px; font-weight: 550; }
    .empty-cell { padding: 28px 0; color: var(--muted); text-align: center !important; }
    .cost-cell { min-width: 130px; }
    .cost-value { color: #44464b; font-weight: 680; }
    .cost-track { display: block; height: 4px; margin-top: 6px; background: #e9e9ea; }
    .cost-fill { display: block; height: 100%; background: var(--blue); }
    .price-link { color: #3694e6; font-weight: 650; }
    .price-note { margin-top: 8px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .table-action {
      display: flex;
      justify-content: center;
      padding-top: 12px;
    }
    .methodology {
      margin-top: 26px;
      border-top: 1px solid var(--line);
      padding-top: 13px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.65;
    }
    @media (max-width: 980px) {
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .client-row { grid-template-columns: 120px minmax(160px, 1fr) 105px 90px 90px; gap: 10px; }
      .chart-shell, .chart-shell.cost-chart { height: 310px; }
    }
    @media (max-width: 680px) {
      .page { padding: 14px 12px 36px; }
      .audit-header { align-items: flex-start; }
      .as-of { white-space: normal; text-align: right; }
      .filters { display: grid; grid-template-columns: 1fr 1fr; }
      input[type="date"] { width: 100%; min-width: 0; }
      .quick-ranges { grid-column: 1 / -1; }
      .kpi-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .kpi { min-height: 86px; padding: 13px; }
      .kpi-value { font-size: 18px; }
      .client-row { grid-template-columns: 92px 1fr; padding: 9px 0; }
      .client-tokens, .client-cost, .client-calls { font-size: 11px; }
      .section-head { align-items: flex-start; }
      h2 { font-size: 17px; }
      .chart-shell, .chart-shell.cost-chart { height: 290px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="audit-header">
      <div class="eyebrow">Local Usage Audit · API-equivalent USD</div>
      <div class="as-of" id="asOf">数据截止 —</div>
    </header>

    <section aria-label="报告筛选器">
      <div class="filters">
        <label class="field">
          <span class="field-label">开始日期</span>
          <input type="date" id="startDate" />
        </label>
        <label class="field">
          <span class="field-label">结束日期</span>
          <input type="date" id="endDate" />
        </label>
        <div class="quick-ranges" aria-label="快捷日期范围">
          <button class="chip" type="button" data-range="7" aria-pressed="false">近 7 天</button>
          <button class="chip" type="button" data-range="30" aria-pressed="false">近 30 天</button>
          <button class="chip" type="button" data-range="all" aria-pressed="false">全部时间</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-name">平台</span>
        <div class="segment-group" id="clientFilters" aria-label="平台筛选"></div>
        <span class="filter-name" style="margin-left:8px">粒度</span>
        <div class="segment-group" id="grainFilters" aria-label="图表粒度">
          <button class="segment" type="button" data-grain="day" aria-pressed="true">每日</button>
          <button class="segment" type="button" data-grain="week" aria-pressed="false">每周</button>
          <button class="segment" type="button" data-grain="month" aria-pressed="false">每月</button>
        </div>
      </div>
      <div class="scope-line" id="scopeLine"></div>
      <div class="notice" id="notice" role="status"></div>
    </section>

    <section class="kpi-grid" id="kpis" aria-label="关键指标"></section>
    <section class="client-summary" id="clientSummary" aria-label="平台用量对比"></section>

    <section class="section">
      <div class="section-head">
        <h2>Token 消耗</h2>
        <div class="section-meta">
          <div class="segment-group" id="tokenStackFilters" aria-label="Token 图堆叠维度">
            <button class="segment" type="button" data-token-stack="type" aria-pressed="true">按类型</button>
            <button class="segment" type="button" data-token-stack="model" aria-pressed="false">按模型</button>
          </div>
          <span id="tokenChartMeta"></span>
        </div>
      </div>
      <div class="chart-shell"><canvas id="tokenChart"></canvas></div>
      <div class="chart-caption" id="tokenCaption"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>缓存命中率</h2>
        <div class="section-meta"><span id="cacheChartMeta"></span></div>
      </div>
      <div class="chart-shell"><canvas id="cacheChart"></canvas></div>
      <div class="chart-caption" id="cacheCaption"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>API 等值费用</h2>
        <div class="section-meta">
          <div class="segment-group" id="costStackFilters" aria-label="费用图堆叠维度">
            <button class="segment" type="button" data-cost-stack="client" aria-pressed="true">按平台</button>
            <button class="segment" type="button" data-cost-stack="model" aria-pressed="false">按模型</button>
          </div>
          <span id="costChartMeta"></span>
        </div>
      </div>
      <div class="chart-shell cost-chart"><canvas id="costChart"></canvas></div>
      <div class="chart-caption" id="costCaption"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>月度汇总</h2>
        <div class="section-meta">当前日期筛选内的月度切片</div>
      </div>
      <div class="table-wrap"><table id="monthlyTable"></table></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>模型与费用</h2>
        <div class="section-meta">
          <div class="segment-group" id="modelViewFilters" aria-label="模型表视图">
            <button class="segment" type="button" data-model-view="summary" aria-pressed="true">区间汇总</button>
            <button class="segment" type="button" data-model-view="monthly" aria-pressed="false">按月明细</button>
            <button class="segment" type="button" data-model-view="daily" aria-pressed="false">按日明细</button>
          </div>
          <div class="segment-group" id="modelMetricFilters" aria-label="明细指标">
            <button class="segment" type="button" data-model-metric="tokens" aria-pressed="true">Token</button>
            <button class="segment" type="button" data-model-metric="calls" aria-pressed="false">调用</button>
            <button class="segment" type="button" data-model-metric="cost" aria-pressed="false">费用</button>
          </div>
        </div>
      </div>
      <div class="table-wrap"><table id="modelTable" class="sticky-col"></table></div>
      <div class="table-action" id="modelTableAction"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>采用的 API 单价</h2>
        <div class="section-meta" id="priceMeta">USD / 1M Token</div>
      </div>
      <div class="table-wrap"><table id="pricingTable"></table></div>
      <div class="price-note">逐条列出 Tokscale 检测到的全部模型；单价在本次报告生成时通过 Tokscale 查询。未匹配到价格的模型仍会保留，并以“—”标记。费用用于本地使用审计，不是账单或发票。</div>
    </section>

    <footer class="methodology" id="methodology"></footer>
  </main>

  <script src="./chart.umd.min.js"></script>
  <script src="./data.js"></script>
  <script>
    const DATA = window.__TOKSCALE_DATA__;
    const METRIC_KEYS = [
      'processedTokens', 'nonCacheTokens', 'inputTokens', 'outputTokens',
      'cacheReadTokens', 'cacheWriteTokens', 'reasoningTokens', 'cost', 'calls'
    ];
    const COLORS = ['#369cf2', '#ff8738', '#56bc78', '#e96b9f', '#8871db', '#25a5a0', '#d86b5d'];
    const CLIENT_COLORS = { codex: '#369cf2', claude: '#ff8738', opencode: '#56bc78', workbuddy: '#e96b9f', zcode: '#8871db' };
    const CLIENT_ORDER = ['codex', 'claude', 'opencode', 'workbuddy', 'zcode'];
    const CLIENT_NAMES = { codex: 'Codex', claude: 'Claude Code', opencode: 'OpenCode', zcode: 'Zcode', workbuddy: 'WorkBuddy' };
    const state = { start: '', end: '', client: 'all', grain: 'day', showAllModels: false, modelView: 'summary', modelMetric: 'tokens', tokenStack: 'type', costStack: 'client' };
    const TOP_MODEL_STACK = 12;
    let tokenChart;
    let costChart;

    const number = (value) => Number(value) || 0;
    const sum = (values) => (values || []).reduce((total, value) => total + number(value), 0);
    const fmtInt = (value) => Math.round(number(value)).toLocaleString('en-US');
    const fmtUsd = (value) => '$' + number(value).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtRate = (value) => '$' + number(value).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 6 });
    const fmtOptionalRate = (value) => value === null || value === undefined ? '—' : fmtRate(value);
    const fmtPct = (value) => (number(value) * 100).toFixed(1) + '%';
    const fmtCompactCn = (value) => {
      const n = number(value);
      if (Math.abs(n) >= 100000000) return (n / 100000000).toFixed(2).replace(/\.00$/, '') + '亿';
      if (Math.abs(n) >= 10000) return (n / 10000).toFixed(2).replace(/\.00$/, '') + '万';
      return fmtInt(n);
    };
    const escapeHtml = (value) => String(value ?? '')
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    const clientName = (client) => CLIENT_NAMES[client] || String(client || 'Unknown');
    const MODEL_METRIC_MAP = { tokens: 'processedTokens', calls: 'calls', cost: 'cost' };
    const MODEL_METRIC_FORMAT = { tokens: fmtCompactCn, calls: fmtInt, cost: fmtUsd };
    const MODEL_METRIC_LABEL = { tokens: 'Token', calls: '调用', cost: '费用' };
    const sortedClients = () => [...(DATA.clients || Object.keys(DATA.dailyClients || {}))].sort((a, b) => {
      const ai = CLIENT_ORDER.indexOf(a);
      const bi = CLIENT_ORDER.indexOf(b);
      return (ai < 0 ? 999 : ai) - (bi < 0 ? 999 : bi) || a.localeCompare(b);
    });
    const parseDate = (value) => {
      const parts = String(value || '').split('-').map(Number);
      return parts.length === 3 && parts.every(Number.isFinite)
        ? new Date(Date.UTC(parts[0], parts[1] - 1, parts[2])) : null;
    };
    const dateIso = (date) => date.toISOString().slice(0, 10);

    function setNotice(message) {
      const node = document.getElementById('notice');
      node.textContent = message || '';
      node.classList.toggle('is-visible', Boolean(message));
    }

    function activeIndices() {
      const indices = [];
      for (let index = 0; index < (DATA?.days || []).length; index++) {
        const day = DATA.days[index];
        if (day >= state.start && day <= state.end) indices.push(index);
      }
      return indices;
    }

    function emptySeries() {
      return Object.fromEntries(METRIC_KEYS.map((key) => [key, []]));
    }

    function sourceForClient(client) {
      if (client === 'all') return DATA.dailyTotals || emptySeries();
      return DATA.dailyClients?.[client] || emptySeries();
    }

    function totalsFor(source, indices) {
      return Object.fromEntries(METRIC_KEYS.map((key) => [
        key,
        indices.reduce((total, index) => total + number(source?.[key]?.[index]), 0)
      ]));
    }

    function weekStartKey(day) {
      // ISO week: Monday is the first day of the week.
      const date = parseDate(day);
      if (!date) return String(day);
      date.setUTCDate(date.getUTCDate() - ((date.getUTCDay() + 6) % 7));
      return dateIso(date);
    }

    function grainKey(day) {
      if (state.grain === 'month') return String(day).slice(0, 7);
      if (state.grain === 'week') return weekStartKey(day);
      return day;
    }

    function aggregateSeries(source, indices, metricKeys, grain = state.grain) {
      const buckets = new Map();
      for (const index of indices) {
        const label = grain === 'month'
          ? String(DATA.days[index]).slice(0, 7)
          : grain === 'week'
            ? weekStartKey(DATA.days[index])
            : DATA.days[index];
        if (!buckets.has(label)) buckets.set(label, Object.fromEntries(metricKeys.map((key) => [key, 0])));
        const bucket = buckets.get(label);
        for (const key of metricKeys) bucket[key] += number(source?.[key]?.[index]);
      }
      const labels = [...buckets.keys()];
      return {
        labels,
        values: Object.fromEntries(metricKeys.map((key) => [key, labels.map((label) => buckets.get(label)[key])]))
      };
    }

    function chartOptions({ stacked = true, currency = false } = {}) {
      return {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 220 },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'top', align: 'end', labels: { color: '#74767b', boxWidth: 9, boxHeight: 9, usePointStyle: false, padding: 14, font: { size: 11 } } },
          tooltip: { callbacks: { label: (item) => `${item.dataset.label}: ${currency ? fmtUsd(item.raw) : fmtInt(item.raw)}` } }
        },
        scales: {
          x: { stacked, border: { display: false }, grid: { display: false }, ticks: { color: '#96979b', maxRotation: 0, autoSkip: true, maxTicksLimit: 12, font: { size: 10 } } },
          y: { stacked, beginAtZero: true, border: { display: false }, grid: { color: '#ececee' }, ticks: { color: '#96979b', font: { size: 10 }, callback: (value) => currency ? fmtUsd(value) : fmtCompactCn(value) } }
        }
      };
    }

    function renderFilters() {
      const container = document.getElementById('clientFilters');
      const clients = sortedClients();
      const rows = [{ id: 'all', label: '全部' }, ...clients.map((id) => ({ id, label: clientName(id) }))];
      container.innerHTML = rows.map((row) => `<button class="segment" type="button" data-client="${escapeHtml(row.id)}" aria-pressed="${row.id === state.client}">${escapeHtml(row.label)}</button>`).join('');
      container.querySelectorAll('[data-client]').forEach((button) => button.addEventListener('click', () => {
        state.client = button.dataset.client;
        renderAll();
      }));
    }

    function renderScope(indices) {
      const platform = state.client === 'all' ? (DATA.clients || []).map(clientName).join(' + ') || '全部平台' : clientName(state.client);
      const grain = state.grain === 'month' ? '每月视图' : state.grain === 'week' ? '每周视图（周一起算）' : '每日视图';
      const start = parseDate(state.start);
      const end = parseDate(state.end);
      const calendarDays = start && end ? Math.floor((end - start) / 86400000) + 1 : indices.length;
      document.getElementById('scopeLine').textContent = `${state.start} 至 ${state.end} · ${platform} · ${grain} · ${calendarDays} 个自然日`;
      document.querySelectorAll('[data-client]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.client === state.client)));
      document.querySelectorAll('[data-grain]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.grain === state.grain)));
      document.querySelectorAll('[data-model-view]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.modelView === state.modelView)));
      document.querySelectorAll('[data-model-metric]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.modelMetric === state.modelMetric)));
      document.querySelectorAll('[data-token-stack]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.tokenStack === state.tokenStack)));
      document.querySelectorAll('[data-cost-stack]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.costStack === state.costStack)));
      const min = DATA.days[0];
      const max = DATA.days[DATA.days.length - 1];
      const quickStart = (days) => {
        const date = parseDate(max);
        date.setUTCDate(date.getUTCDate() - days + 1);
        return dateIso(date);
      };
      document.querySelectorAll('[data-range]').forEach((button) => {
        const value = button.dataset.range;
        const pressed = value === 'all'
          ? state.start === min && state.end === max
          : state.start === quickStart(Number(value)) && state.end === max;
        button.setAttribute('aria-pressed', String(pressed));
      });
    }

    function renderKPIs(indices) {
      const totals = totalsFor(sourceForClient(state.client), indices);
      const cache = totals.cacheReadTokens + totals.cacheWriteTokens;
      const cacheRatio = totals.processedTokens ? cache / totals.processedTokens : 0;
      const active = Math.max(1, indices.filter((index) => number(sourceForClient(state.client).processedTokens?.[index]) > 0).length);
      const cards = [
        ['总 Token', fmtCompactCn(totals.processedTokens), `精确 ${fmtInt(totals.processedTokens)} · 缓存命中 ${fmtPct(cacheRatio)}`],
        ['API 等值费用', fmtUsd(totals.cost), totals.calls ? `平均 ${fmtUsd(totals.cost / totals.calls)} / 调用` : '当前范围无调用'],
        ['模型调用', fmtInt(totals.calls), `${active} 个活跃日 · ${fmtInt(totals.calls / active)} / 日`],
        ['模型输出', fmtCompactCn(totals.outputTokens), `精确 ${fmtInt(totals.outputTokens)} · ${fmtInt(totals.outputTokens / active)} / 日`]
      ];
      document.getElementById('kpis').innerHTML = cards.map(([label, value, detail]) => `<article class="kpi"><div class="kpi-label">${escapeHtml(label)}</div><div class="kpi-value">${escapeHtml(value)}</div><div class="kpi-detail">${escapeHtml(detail)}</div></article>`).join('');
    }

    function renderClientSummary(indices) {
      const clients = state.client === 'all' ? sortedClients() : [state.client];
      const rows = clients.map((client, index) => ({ client, index, totals: totalsFor(sourceForClient(client), indices) })).filter((row) => row.totals.processedTokens > 0);
      const max = Math.max(1, ...rows.map((row) => row.totals.processedTokens));
      const html = rows.map((row) => `<div class="client-row"><div class="client-name">${escapeHtml(clientName(row.client))}</div><div class="client-track"><div class="client-fill" style="width:${Math.max(0.7, row.totals.processedTokens / max * 100)}%;background:${CLIENT_COLORS[row.client] || COLORS[row.index % COLORS.length]}"></div></div><div class="client-tokens"><strong>${escapeHtml(fmtCompactCn(row.totals.processedTokens))}</strong><span class="client-unit">Token</span></div><div class="client-cost">${escapeHtml(fmtUsd(row.totals.cost))}</div><div class="client-calls">${escapeHtml(fmtInt(row.totals.calls))} <span class="client-unit">调用</span></div></div>`).join('');
      document.getElementById('clientSummary').innerHTML = html || '<div class="empty-cell">当前筛选范围没有平台用量</div>';
    }

    function modelStackSeries(indices, metricKey) {
      const rows = (DATA.modelCatalog || [])
        .filter((item) => state.client === 'all' || item.client === state.client)
        .map((item) => ({ label: item.label, name: item.model, totals: totalsFor(DATA.dailyModels?.[item.label] || emptySeries(), indices) }))
        .filter((row) => row.totals[metricKey] > 0)
        .sort((a, b) => b.totals[metricKey] - a.totals[metricKey]);
      const top = rows.slice(0, TOP_MODEL_STACK);
      const rest = rows.slice(TOP_MODEL_STACK);
      const series = top.map((row, index) => ({ id: row.label, label: row.name, color: COLORS[index % COLORS.length] }));
      if (rest.length) series.push({ id: '__other__', label: `其他 ${rest.length} 个模型`, color: '#b9bbbf' });
      const seriesOf = (id, index) => {
        if (id === '__other__') return rest.reduce((total, row) => total + number(DATA.dailyModels?.[row.label]?.[metricKey]?.[index]), 0);
        return number(DATA.dailyModels?.[id]?.[metricKey]?.[index]);
      };
      return { series, seriesOf, topCount: top.length, otherCount: rest.length };
    }

    function renderTokenChart(indices) {
      const stackByModel = state.tokenStack === 'model';
      let series;
      let seriesOf;
      if (stackByModel) {
        const model = modelStackSeries(indices, 'processedTokens');
        series = model.series;
        seriesOf = model.seriesOf;
      } else {
        const metrics = ['inputTokens', 'cacheReadTokens', 'cacheWriteTokens', 'outputTokens'];
        const labels = ['普通输入', '缓存读取', '缓存写入', '输出'];
        series = metrics.map((key, index) => ({ id: key, label: labels[index], color: COLORS[index % COLORS.length] }));
        seriesOf = (id, index) => number(sourceForClient(state.client)[id]?.[index]);
      }
      if (!series.length) {
        if (tokenChart) tokenChart.destroy();
        document.getElementById('tokenChartMeta').textContent = '';
        document.getElementById('tokenCaption').textContent = '当前筛选范围没有 Token 数据';
        return;
      }
      const buckets = new Map();
      for (const index of indices) {
        const label = grainKey(DATA.days[index]);
        if (!buckets.has(label)) buckets.set(label, Object.fromEntries(series.map((item) => [item.id, 0])));
        for (const item of series) buckets.get(label)[item.id] += seriesOf(item.id, index);
      }
      const labels = [...buckets.keys()];
      if (tokenChart) tokenChart.destroy();
      tokenChart = new Chart(document.getElementById('tokenChart'), {
        type: 'bar',
        data: { labels, datasets: series.map((item) => ({ label: item.label, data: labels.map((label) => buckets.get(label)[item.id]), backgroundColor: item.color, borderWidth: 0, barPercentage: .88, categoryPercentage: .92 })) },
        options: chartOptions({ stacked: true })
      });
      document.getElementById('tokenChartMeta').textContent = stackByModel
        ? `按模型堆叠 · Token Top ${series.length - (series.some((item) => item.id === '__other__') ? 1 : 0)}`
        : (state.client === 'all' ? '全部平台 Token 组成' : `${clientName(state.client)} Token 组成`);
      const peak = labels.map((label, index) => ({ label, value: series.reduce((total, item) => total + number(buckets.get(label)[item.id]), 0) })).sort((a, b) => b.value - a.value)[0];
      document.getElementById('tokenCaption').textContent = peak ? `${peak.label} · 峰值 ${fmtInt(peak.value)} Token` : '当前筛选范围没有 Token 数据';
    }

    function lineChartOptions() {
      return {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 220 },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'top', align: 'end', labels: { color: '#74767b', boxWidth: 9, boxHeight: 9, padding: 14, font: { size: 11 } } },
          tooltip: { callbacks: { label: (item) => `${item.dataset.label}: ${fmtPct(number(item.raw) / 100)}` } }
        },
        scales: {
          x: { border: { display: false }, grid: { display: false }, ticks: { color: '#96979b', maxRotation: 0, autoSkip: true, maxTicksLimit: 12, font: { size: 10 } } },
          y: { beginAtZero: true, max: 100, border: { display: false }, grid: { color: '#ececee' }, ticks: { color: '#96979b', font: { size: 10 }, callback: (value) => value + '%' } }
        }
      };
    }

    function renderCacheChart(indices) {
      const clients = state.client === 'all' ? sortedClients() : [state.client];
      const buckets = new Map();
      for (const index of indices) {
        const label = grainKey(DATA.days[index]);
        for (const client of clients) {
          const source = DATA.dailyClients?.[client];
          if (!source) continue;
          const cached = number(source.cacheReadTokens?.[index]) + number(source.cacheWriteTokens?.[index]);
          const processed = number(source.processedTokens?.[index]);
          if (!processed) continue;
          if (!buckets.has(label)) buckets.set(label, {});
          const entry = (buckets.get(label)[client] = buckets.get(label)[client] || { cached: 0, processed: 0 });
          entry.cached += cached;
          entry.processed += processed;
        }
      }
      const labels = [...buckets.keys()];
      const datasets = clients.map((client, index) => {
        const values = labels.map((label) => {
          const entry = buckets.get(label)?.[client];
          return entry && entry.processed ? entry.cached / entry.processed * 100 : null;
        });
        return { label: clientName(client), data: values, borderColor: CLIENT_COLORS[client] || COLORS[index % COLORS.length], backgroundColor: CLIENT_COLORS[client] || COLORS[index % COLORS.length], borderWidth: 2, pointRadius: 2, pointHitRadius: 6, tension: .25 };
      }).filter((dataset) => dataset.data.some((value) => value !== null));
      const cacheChart = Chart.getChart(document.getElementById('cacheChart'));
      if (cacheChart) cacheChart.destroy();
      if (!datasets.length) {
        document.getElementById('cacheChartMeta').textContent = '';
        document.getElementById('cacheCaption').textContent = '当前筛选范围没有缓存数据';
        return;
      }
      new Chart(document.getElementById('cacheChart'), {
        type: 'line',
        data: { labels, datasets },
        options: lineChartOptions()
      });
      const cached = indices.reduce((total, index) => total + (state.client === 'all'
        ? Object.keys(DATA.dailyClients || {}).reduce((sum, client) => sum + number(DATA.dailyClients[client].cacheReadTokens?.[index]) + number(DATA.dailyClients[client].cacheWriteTokens?.[index]), 0)
        : number(sourceForClient(state.client).cacheReadTokens?.[index]) + number(sourceForClient(state.client).cacheWriteTokens?.[index])), 0);
      const processed = indices.reduce((total, index) => total + (state.client === 'all'
        ? Object.keys(DATA.dailyClients || {}).reduce((sum, client) => sum + number(DATA.dailyClients[client].processedTokens?.[index]), 0)
        : number(sourceForClient(state.client).processedTokens?.[index])), 0);
      document.getElementById('cacheChartMeta').textContent = state.client === 'all' ? '按平台对比' : `${clientName(state.client)} 缓存命中率`;
      document.getElementById('cacheCaption').textContent = processed ? `范围平均缓存命中 ${fmtPct(cached / processed)}` : '当前筛选范围没有缓存数据';
    }

    function renderCostChart(indices) {
      const stackByModel = state.costStack === 'model';
      let series;
      let seriesOf;
      if (stackByModel) {
        const model = modelStackSeries(indices, 'cost');
        series = model.series;
        seriesOf = model.seriesOf;
      } else {
        const clients = state.client === 'all' ? sortedClients() : [state.client];
        series = clients.map((client, index) => ({ id: client, label: clientName(client), color: CLIENT_COLORS[client] || COLORS[index % COLORS.length] }));
        seriesOf = (id, index) => number(sourceForClient(id).cost?.[index]);
      }
      if (!series.length) {
        if (costChart) costChart.destroy();
        document.getElementById('costChartMeta').textContent = '';
        document.getElementById('costCaption').textContent = '当前筛选范围没有费用数据';
        return;
      }
      const buckets = new Map();
      for (const index of indices) {
        const label = grainKey(DATA.days[index]);
        if (!buckets.has(label)) buckets.set(label, Object.fromEntries(series.map((item) => [item.id, 0])));
        for (const item of series) buckets.get(label)[item.id] += seriesOf(item.id, index);
      }
      const labels = [...buckets.keys()];
      if (costChart) costChart.destroy();
      costChart = new Chart(document.getElementById('costChart'), {
        type: 'bar',
        data: { labels, datasets: series.map((item) => ({ label: item.label, data: labels.map((label) => buckets.get(label)[item.id]), backgroundColor: item.color, borderWidth: 0, barPercentage: .88, categoryPercentage: .92 })) },
        options: chartOptions({ stacked: true, currency: true })
      });
      document.getElementById('costChartMeta').textContent = stackByModel
        ? `按模型堆叠 · 费用 Top ${series.length - (series.some((item) => item.id === '__other__') ? 1 : 0)}`
        : (state.client === 'all' ? '按平台堆叠' : `${clientName(state.client)} 单平台`);
      const peak = labels.map((label, index) => ({ label, value: series.reduce((total, item) => total + number(buckets.get(label)[item.id]), 0) })).sort((a, b) => b.value - a.value)[0];
      document.getElementById('costCaption').textContent = peak ? `${peak.label} · 峰值 ${fmtUsd(peak.value)}` : '当前筛选范围没有费用数据';
    }

    function renderMonthlyTable(indices) {
      const clients = state.client === 'all' ? sortedClients() : [state.client];
      const rows = [];
      for (const client of clients) {
        const source = sourceForClient(client);
        const months = new Map();
        for (const index of indices) {
          const month = DATA.days[index].slice(0, 7);
          if (!months.has(month)) months.set(month, Object.fromEntries(METRIC_KEYS.map((key) => [key, 0])));
          for (const key of METRIC_KEYS) months.get(month)[key] += number(source[key]?.[index]);
        }
        for (const [month, totals] of months) if (totals.processedTokens > 0) rows.push({ month, client, totals });
      }
      rows.sort((a, b) => a.month.localeCompare(b.month) || a.client.localeCompare(b.client));
      let body = rows.map((row) => {
        const cache = row.totals.cacheReadTokens + row.totals.cacheWriteTokens;
        return `<tr><td class="cell-primary">${escapeHtml(row.month)}</td><td>${escapeHtml(clientName(row.client))}</td><td>${fmtInt(row.totals.processedTokens)}</td><td>${fmtUsd(row.totals.cost)}</td><td>${fmtInt(row.totals.calls)}</td><td>${fmtInt(row.totals.outputTokens)}</td><td>${fmtPct(row.totals.processedTokens ? cache / row.totals.processedTokens : 0)}</td></tr>`;
      }).join('');
      if (!body) body = '<tr><td class="empty-cell" colspan="7">当前筛选范围没有月度数据</td></tr>';
      document.getElementById('monthlyTable').innerHTML = `<thead><tr><th>月份</th><th>平台</th><th>Token</th><th>费用</th><th>调用</th><th>输出</th><th>缓存命中</th></tr></thead><tbody>${body}</tbody>`;
    }

    function renderModelTable(indices) {
      if (state.modelView === 'monthly' || state.modelView === 'daily') {
        renderModelDetailTable(indices, state.modelView);
        return;
      }
      const rows = (DATA.modelCatalog || []).filter((item) => state.client === 'all' || item.client === state.client).map((item) => ({ ...item, totals: totalsFor(DATA.dailyModels?.[item.label] || emptySeries(), indices) })).filter((item) => item.totals.processedTokens > 0).sort((a, b) => b.totals.cost - a.totals.cost);
      const maxCost = Math.max(0.000001, ...rows.map((row) => row.totals.cost));
      const visibleRows = state.showAllModels ? rows : rows.slice(0, 12);
      let body = visibleRows.map((row) => `<tr><td class="cell-primary"><span class="cell-prefix">${escapeHtml(clientName(row.client))}</span>${escapeHtml(row.model)}</td><td>${fmtInt(row.totals.inputTokens)}</td><td>${fmtInt(row.totals.cacheReadTokens)}</td><td>${fmtInt(row.totals.cacheWriteTokens)}</td><td>${fmtInt(row.totals.outputTokens)}</td><td>${fmtInt(row.totals.calls)}</td><td class="cost-cell"><span class="cost-value">${fmtUsd(row.totals.cost)}</span><span class="cost-track"><span class="cost-fill" style="width:${row.totals.cost / maxCost * 100}%"></span></span></td></tr>`).join('');
      if (!body) body = '<tr><td class="empty-cell" colspan="7">当前筛选范围没有模型数据</td></tr>';
      document.getElementById('modelTable').innerHTML = `<thead><tr><th>平台 / 模型</th><th>普通输入</th><th>缓存读</th><th>缓存写</th><th>输出</th><th>调用</th><th>费用</th></tr></thead><tbody>${body}</tbody>`;
      const action = document.getElementById('modelTableAction');
      action.innerHTML = rows.length > 12
        ? `<button class="chip" type="button" data-model-expand aria-pressed="${state.showAllModels}">${state.showAllModels ? '收起模型' : `展开全部 ${rows.length} 个模型`}</button>`
        : '';
      const toggle = action.querySelector('[data-model-expand]');
      if (toggle) toggle.addEventListener('click', () => {
        state.showAllModels = !state.showAllModels;
        renderModelTable(activeIndices());
      });
    }

    function renderModelDetailTable(indices, grainView) {
      const metricKey = MODEL_METRIC_MAP[state.modelMetric];
      const format = MODEL_METRIC_FORMAT[state.modelMetric];
      const rows = (DATA.modelCatalog || [])
        .filter((item) => state.client === 'all' || item.client === state.client)
        .map((item) => ({ ...item, totals: totalsFor(DATA.dailyModels?.[item.label] || emptySeries(), indices) }))
        .filter((item) => item.totals.processedTokens > 0)
        .sort((a, b) => b.totals.cost - a.totals.cost);
      const visibleRows = state.showAllModels ? rows : rows.slice(0, 12);
      const grain = grainView === 'monthly' ? 'month' : 'day';
      let columnLabels = [];
      const cells = visibleRows.map((row) => {
        const aggregated = aggregateSeries(DATA.dailyModels?.[row.label] || emptySeries(), indices, [metricKey], grain);
        if (!columnLabels.length) columnLabels = aggregated.labels;
        const byLabel = new Map(aggregated.labels.map((label, index) => [label, aggregated.values[metricKey][index]]));
        return { row, byLabel };
      });
      const crossYear = indices.length > 1 && DATA.days[indices[0]].slice(0, 4) !== DATA.days[indices[indices.length - 1]].slice(0, 4);
      const fmtColumn = (label) => grain === 'month' ? label : (crossYear ? label : label.slice(5));
      const metricLabel = MODEL_METRIC_LABEL[state.modelMetric];
      const colspan = 2 + columnLabels.length;
      let body = cells.map(({ row, byLabel }) => {
        const values = columnLabels.map((label) => {
          const value = byLabel.get(label) || 0;
          return `<td>${value > 0 ? format(value) : '—'}</td>`;
        }).join('');
        return `<tr><td class="cell-primary"><span class="cell-prefix">${escapeHtml(clientName(row.client))}</span>${escapeHtml(row.model)}</td>${values}<td class="cell-primary">${format(row.totals[metricKey])}</td></tr>`;
      }).join('');
      if (!body) body = `<tr><td class="empty-cell" colspan="${colspan}">当前筛选范围没有模型数据</td></tr>`;
      document.getElementById('modelTable').innerHTML = `<thead><tr><th>平台 / 模型</th>${columnLabels.map((label) => `<th>${escapeHtml(fmtColumn(label))}</th>`).join('')}<th>区间${metricLabel}</th></tr></thead><tbody>${body}</tbody>`;
      const action = document.getElementById('modelTableAction');
      action.innerHTML = rows.length > 12
        ? `<button class="chip" type="button" data-model-expand aria-pressed="${state.showAllModels}">${state.showAllModels ? '收起模型' : `展开全部 ${rows.length} 个模型`}</button>`
        : '';
      const toggle = action.querySelector('[data-model-expand]');
      if (toggle) toggle.addEventListener('click', () => {
        state.showAllModels = !state.showAllModels;
        renderModelTable(activeIndices());
      });
    }

    function renderPricingTable() {
      const pricing = DATA?.meta?.report?.pricingRows || [];
      const rows = pricing.length
        ? pricing.map((row) => `<tr><td class="price-link">${escapeHtml(row.model)}</td><td>${fmtOptionalRate(row.input)}</td><td>${fmtOptionalRate(row.cacheRead)}</td><td>${fmtOptionalRate(row.cacheWrite)}</td><td>${fmtOptionalRate(row.output)}</td><td>${escapeHtml(row.source)}</td></tr>`).join('')
        : '<tr><td colspan="6">本机暂未检测到模型使用记录</td></tr>';
      document.getElementById('pricingTable').innerHTML = `<thead><tr><th>模型</th><th>普通输入</th><th>缓存读</th><th>缓存写</th><th>输出</th><th>计价依据</th></tr></thead><tbody>${rows}</tbody>`;
      const matched = pricing.filter((row) => row.status === 'matched').length;
      document.getElementById('priceMeta').textContent = `USD / 1M Token · Tokscale · ${matched}/${pricing.length} 已匹配`;
    }

    function renderMethodology() {
      const report = DATA?.meta?.report || {};
      const runtime = report.runtime || {};
      document.getElementById('methodology').textContent = `口径：Processed Token = 普通输入 + 输出 + 缓存读取 + 缓存写入；Reasoning 已包含在输出中，不重复相加。模型调用来自 Tokscale messageCount，不等于用户会话数。运行时 tokscale ${runtime.version || 'unknown'} (${runtime.source || 'unknown'})。费用为 API 等值估算，不是账单。`;
      const warnings = report.warnings || [];
      if (warnings.length) setNotice(warnings.join(' '));
    }

    function renderAll() {
      if (!DATA || !window.Chart) return;
      const indices = activeIndices();
      renderScope(indices);
      renderKPIs(indices);
      renderClientSummary(indices);
      renderTokenChart(indices);
      renderCacheChart(indices);
      renderCostChart(indices);
      renderMonthlyTable(indices);
      renderModelTable(indices);
      if (!indices.length) setNotice('当前日期范围没有数据，请调整开始或结束日期。');
      else if (!(DATA?.meta?.report?.warnings || []).length) setNotice('');
    }

    function setRange(start, end) {
      if (!start || !end || start > end) {
        setNotice('开始日期不能晚于结束日期。');
        return;
      }
      const min = DATA.days[0];
      const max = DATA.days[DATA.days.length - 1];
      state.start = start < min ? min : start;
      state.end = end > max ? max : end;
      document.getElementById('startDate').value = state.start;
      document.getElementById('endDate').value = state.end;
      renderAll();
    }

    function initialize() {
      if (!DATA || !Array.isArray(DATA.days) || !DATA.days.length) {
        setNotice('报告数据缺失。请将 report.html、data.js 与 chart.umd.min.js 保持在同一目录。');
        return;
      }
      if (!window.Chart) {
        setNotice('图表运行文件加载失败。请确认 chart.umd.min.js 与 report.html 在同一目录。');
        return;
      }
      const min = DATA.days[0];
      const max = DATA.days[DATA.days.length - 1];
      const initial = DATA?.meta?.report?.initialRange || {};
      state.start = initial.start && initial.start >= min ? initial.start : min;
      state.end = initial.end && initial.end <= max ? initial.end : max;
      const startInput = document.getElementById('startDate');
      const endInput = document.getElementById('endDate');
      for (const input of [startInput, endInput]) { input.min = min; input.max = max; }
      startInput.value = state.start;
      endInput.value = state.end;
      const generated = DATA?.meta?.report?.generatedAt || max;
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'local';
      document.getElementById('asOf').textContent = `数据截止 ${String(generated).slice(0, 10)} · ${timezone}`;
      renderFilters();
      renderPricingTable();
      renderMethodology();
      startInput.addEventListener('change', () => setRange(startInput.value, endInput.value));
      endInput.addEventListener('change', () => setRange(startInput.value, endInput.value));
      document.querySelectorAll('[data-range]').forEach((button) => button.addEventListener('click', () => {
        const value = button.dataset.range;
        if (value === 'all') return setRange(min, max);
        const end = parseDate(max);
        const start = new Date(end);
        start.setUTCDate(start.getUTCDate() - Number(value) + 1);
        setRange(dateIso(start), max);
      }));
      document.querySelectorAll('[data-grain]').forEach((button) => button.addEventListener('click', () => {
        state.grain = button.dataset.grain;
        renderAll();
      }));
      document.querySelectorAll('[data-model-view]').forEach((button) => button.addEventListener('click', () => {
        state.modelView = button.dataset.modelView;
        state.showAllModels = false;
        renderAll();
      }));
      document.querySelectorAll('[data-model-metric]').forEach((button) => button.addEventListener('click', () => {
        state.modelMetric = button.dataset.modelMetric;
        renderAll();
      }));
      document.querySelectorAll('[data-token-stack]').forEach((button) => button.addEventListener('click', () => {
        state.tokenStack = button.dataset.tokenStack;
        renderAll();
      }));
      document.querySelectorAll('[data-cost-stack]').forEach((button) => button.addEventListener('click', () => {
        state.costStack = button.dataset.costStack;
        renderAll();
      }));
      renderAll();
    }

    try { initialize(); }
    catch (error) { setNotice('仪表盘渲染失败：' + (error?.message || String(error))); }
  </script>
</body>
</html>
